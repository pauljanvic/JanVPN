<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JanVPN</title>
<style>
* {box-sizing:border-box}
body {
  margin:0;
  padding:25px 15px;
  background:#050a10;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}
h1 {
  color:#00ff99;
  text-shadow:0 0 15px #00ff99;
  animation:glow 2s infinite alternate;
}
@keyframes glow {
  from {text-shadow:0 0 5px #00ff99}
  to {text-shadow:0 0 25px #00ff99}
}
.card {
  max-width:420px;
  margin:30px auto;
  padding:25px;
  background:#101b24;
  border:1px solid #00ff99;
  border-radius:22px;
  box-shadow:0 0 20px #00ff9933;
}
.server {
  display:block;
  width:100%;
  margin:10px 0;
  padding:15px;
  background:#071019;
  color:#00ff99;
  border:1px solid #00ff99;
  border-radius:12px;
  font-weight:bold;
}
.server:focus {
  background:#123027;
}
button {
  background:#00ff99;
  color:#06130d;
  border:0;
  border-radius:30px;
  padding:15px 35px;
  font-weight:bold;
  margin:15px;
}
#status {color:#00ff99;margin:20px}
.speed {
  display:flex;
  gap:12px;
}
.speed-box {
  flex:1;
  background:#071019;
  border:1px solid #00ff99;
  border-radius:12px;
  padding:12px 5px;
}
.speed-box h3 {color:#00ff99}
#loader {
  display:none;
  margin:15px auto;
  width:28px;
  height:28px;
  border:3px solid #244438;
  border-top:3px solid #00ff99;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin {
  to {transform:rotate(360deg)}
}
footer {color:#777;margin-top:25px;font-size:12px}
</style>
</head>
<body>

<h1>⚡ JanVPN</h1>

<div class="card">
<h2>VPN Dashboard</h2>
<p>Select Server</p>

<button class="server" onclick="selectServer(25,'Philippines')">🇵🇭 Philippines</button>
<button class="server" onclick="selectServer(45,'Singapore')">🇸🇬 Singapore</button>
<button class="server" onclick="selectServer(60,'Japan')">🇯🇵 Japan</button>

<p id="selected">Selected: Philippines</p>
<p id="ping">Demo Ping: 25 ms</p>
<p id="status">Status: Disconnected</p>

<div id="loader"></div>

<button onclick="connect()" id="connectBtn">CONNECT</button>

<div class="speed">
<div class="speed-box">
<h3>⬇ Download</h3>
<p id="download">0 Mbps</p>
</div>
<div class="speed-box">
<h3>⬆ Upload</h3>
<p id="upload">0 Mbps</p>
</div>
</div>

<footer>JanVPN © 2026<br>Demo Dashboard</footer>
</div>

<script>
let connected=false;
let selectedServer="Philippines";

function selectServer(ping,name) {
 selectedServer=name;
 document.getElementById("selected").textContent="Selected: "+name;
 document.getElementById("ping").textContent="Demo Ping: "+ping+" ms";
}

function connect() {
 if(connected) {
  connected=false;
  document.getElementById("status").textContent="Status: Disconnected";
  document.getElementById("connectBtn").textContent="CONNECT";
  document.getElementById("download").textContent="0 Mbps";
  document.getElementById("upload").textContent="0 Mbps";
  return;
 }

 document.getElementById("loader").style.display="block";
 document.getElementById("status").textContent="Demo: Connecting...";
 document.getElementById("connectBtn").disabled=true;

 setTimeout(function() {
  connected=true;
  document.getElementById("loader").style.display="none";
  document.getElementById("status").textContent="Demo Mode: "+selectedServer;
  document.getElementById("connectBtn").textContent="DISCONNECT";
  document.getElementById("connectBtn").disabled=false;
  document.getElementById("download").textContent="12.5 Mbps";
  document.getElementById("upload").textContent="5.2 Mbps";
 },1500);
}
</script>
</body>
</html>
