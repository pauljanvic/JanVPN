<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JanVPN</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080d12;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  padding: 25px;
  color: #00ff99;
  font-size: 30px;
  font-weight: bold;
}
.container {
  max-width: 420px;
  margin: 30px auto;
  padding: 25px;
}
.card {
  background: #111b22;
  border: 1px solid #00ff99;
  border-radius: 20px;
  padding: 30px 20px;
  box-shadow: 0 0 20px #00ff9922;
}
.status {
  color: #aaa;
  margin: 20px;
}
.circle {
  width: 150px;
  height: 150px;
  border: 5px solid #00ff99;
  border-radius: 50%;
  margin: 25px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 45px;
  box-shadow: 0 0 25px #00ff9944;
}
button {
  background: #00ff99;
  border: none;
  padding: 15px 40px;
  border-radius: 30px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  color: #07120d;
}
button:active { transform: scale(.96); }
footer {
  color: #777;
  margin-top: 35px;
  font-size: 12px;
}
</style>
</head>
<body>
<header>⚡ JanVPN</header>
<div class="container">
  <div class="card">
    <h2>Welcome to JanVPN</h2>
    <p>Neon Android VPN Experience</p>
    <div class="circle">⚡</div>
    <div class="status" id="status">Status: Disconnected</div>
    <button onclick="toggleVPN()" id="btn">CONNECT</button>
  </div>
  <footer>JanVPN © 2026<br>Powered by WireGuard</footer>
</div>
<script>
let connected = false;
function toggleVPN() {
  connected = !connected;
  document.getElementById("status").textContent =
    "Status: " + (connected ? "Demo Connected" : "Disconnected");
  document.getElementById("btn").textContent =
    connected ? "DISCONNECT" : "CONNECT";
}
</script>
</body>
</html>
