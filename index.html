<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JanVPN</title>
<style>
body {
  background:#080d12;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}
h1 {color:#00ff99;text-shadow:0 0 15px #00ff99;}
.card {
  max-width:400px;
  margin:25px auto;
  padding:25px;
  background:#111b22;
  border:1px solid #00ff99;
  border-radius:20px;
  box-shadow:0 0 20px #00ff9922;
}
select {
  padding:14px;
  width:100%;
  border-radius:10px;
  background:#080d12;
  color:#00ff99;
  border:1px solid #00ff99;
  margin:15px 0;
}
button {
  background:#00ff99;
  color:#07120d;
  border:0;
  border-radius:30px;
  padding:15px 35px;
  font-weight:bold;
}
#status,#ping {color:#00ff99;margin:18px;}
.speed {
  display:flex;
  gap:12px;
  margin-top:20px;
}
.speed-box {
  flex:1;
  background:#080d12;
  border:1px solid #00ff99;
  border-radius:12px;
  padding:15px 5px;
}
.speed-box h3 {color:#00ff99;}
footer {color:#777;margin-top:25px;font-size:12px;}
</style>
</head>
<body>
<h1>⚡ JanVPN</h1>
<div class="card">
<h2>VPN Dashboard</h2>

<p>Select Server</p>
<select id="server" onchange="updatePing()">
<option value="25">🇵🇭 Philippines</option>
<option value="45">🇸🇬 Singapore</option>
<option value="60">🇯🇵 Japan</option>
</select>

<p id="ping">Demo Ping: 25 ms</p>
<p id="status">Status: Disconnected</p>

<button onclick="connect()" id="btn">CONNECT</button>

<div class="speed">
<div class="speed-box">
<h3>⬇ Download</h3>
<p id="download">0 Mbps</p>
</div>
<div class="speed-box">
<h3>⬆ Upload</h3>
<p id="upload">0 Mbps</p>
</div>
</div>

<footer>JanVPN © 2026<br>Demo Dashboard</footer>
</div>

<script>
let connected=false;

function updatePing(){
let ping=document.getElementById("server").value;
document.getElementById("ping").textContent=
"Demo Ping: "+ping+" ms";
}

function connect(){
connected=!connected;

document.getElementById("status").textContent=
connected?"Status: Demo Connected":"Status: Disconnected";

document.getElementById("btn").textContent=
connected?"DISCONNECT":"CONNECT";

document.getElementById("download").textContent=
connected?"12.5 Mbps":"0 Mbps";

document.getElementById("upload").textContent=
connected?"5.2 Mbps":"0 Mbps";
}
</script>
</body>
</html>
