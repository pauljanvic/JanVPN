<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JanVPN</title>
<style>
body {
  background:#080d12;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}
h1 {color:#00ff99;}
.card {
  max-width:400px;
  margin:30px auto;
  padding:25px;
  background:#111b22;
  border:1px solid #00ff99;
  border-radius:20px;
}
select {
  padding:14px;
  width:100%;
  border-radius:10px;
  background:#080d12;
  color:#00ff99;
  border:1px solid #00ff99;
  margin:15px 0;
}
button {
  background:#00ff99;
  color:#07120d;
  border:0;
  border-radius:30px;
  padding:15px 35px;
  font-weight:bold;
}
#status {color:#00ff99;margin:20px;}
#ping {color:#00ff99;font-size:18px;}
</style>
</head>
<body>
<h1>⚡ JanVPN</h1>
<div class="card">
<h2>VPN Dashboard</h2>
<p>Select Server</p>
<select id="server" onchange="updatePing()">
<option value="25">🇵🇭 Philippines</option>
<option value="45">🇸🇬 Singapore</option>
<option value="60">🇯🇵 Japan</option>
</select>
<p id="ping">Demo Ping: 25 ms</p>
<p id="status">Status: Disconnected</p>
<button onclick="connect()">CONNECT</button>
</div>
<script>
function updatePing(){
let ping=document.getElementById("server").value;
document.getElementById("ping").textContent=
"Demo Ping: "+ping+" ms";
}
function connect(){
let server=document.getElementById("server");
document.getElementById("status").textContent=
"Demo Mode - Selected: "+server.options[server.selectedIndex].text;
}
</script>
</body>
</html>
