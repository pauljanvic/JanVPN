<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JanVPN</title>
<style>
body {
  background:#080d12;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}
h1 {color:#00ff99;}
.card {
  max-width:400px;
  margin:30px auto;
  padding:25px;
  background:#111b22;
  border:1px solid #00ff99;
  border-radius:20px;
}
select {
  padding:14px;
  width:100%;
  border-radius:10px;
  background:#080d12;
  color:#00ff99;
  border:1px solid #00ff99;
  margin:15px 0;
}
button {
  background:#00ff99;
  color:#07120d;
  border:0;
  border-radius:30px;
  padding:15px 35px;
  font-weight:bold;
}
#status {color:#00ff99;margin:20px;}
</style>
</head>
<body>
<h1>⚡ JanVPN</h1>
<div class="card">
<h2>VPN Dashboard</h2>
<p>Select Server</p>
<select id="server">
<option>🇵🇭 Philippines</option>
<option>🇸🇬 Singapore</option>
<option>🇯🇵 Japan</option>
</select>
<p id="status">Status: Disconnected</p>
<button onclick="connect()">CONNECT</button>
</div>
<script>
function connect(){
let server=document.getElementById("server").value;
document.getElementById("status").textContent=
"Demo Mode - Selected: "+server;
}
</script>
</body>
</html>
